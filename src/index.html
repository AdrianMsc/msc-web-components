<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>
    <script type="module" src="/build/msc-ds-wc.esm.js"></script>
    <script nomodule src="/build/msc-ds-wc.js"></script>
  </head>
  <body>
    <msc-table id="mscTable"></msc-table>

    <script>
      getTableData = () => {
        fetch('https://msc-component-status-ws.onrender.com/components/')
          .then(response => response.json())
          .then(data => {
            const mscTable = document.getElementById('mscTable');
            mscTable.comps = null;
            mscTable.comps = data;
            console.log('Fetched', data);
          })
          .catch(error => {
            console.error('Error fetching components:', error);
          });
      };

      document.addEventListener('DOMContentLoaded', function () {
        getTableData();
      });
    </script>
